{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'tracker/style.css' %}">
  <style>
    html, body { height: 100%; margin: 0; }
    .home-wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .home-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }
    .hero-title {
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 800;
      letter-spacing: -3px;
      color: #6f42c1;
      -webkit-text-fill-color: #6f42c1;
      line-height: 1;
      user-select: none;
      margin: 0;
      cursor: pointer;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hero-actions .btn {
      padding: 0.6rem 2rem;
      border-radius: 50px;
      font-size: 1rem;
      min-width: 140px;
    }
    .hero-title-link {
      text-decoration: none;
      display: inline-block; 
    } 
  </style>
</head>
<body class="bg-light">
<div class="home-wrap">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">StudyTrack</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarMenu"
              aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMenu">
        {% if user.is_authenticated %}
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{% url 'record_list' %}">Records</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'course_list' %}">Courses</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'goal_list' %}">Goals</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <span class="text-white small">Hi, {{ user.username }}</span>
          <a href="{% url 'record_create' %}" class="btn btn-light btn-sm">+ New Record</a>
          <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
        {% else %}
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
        </ul>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="home-hero">
    <a href="{% url 'record_list' %}" class="hero-title-link">
      <h1 class="hero-title">StudyTrack</h1>
    </a>

    <div class="hero-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'record_list' %}" class="btn btn-primary btn-lg">Go to Records</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Login</a>
        <a href="{% url 'register' %}" class="btn btn-outline-primary btn-lg">Register</a>
      {% endif %}
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
